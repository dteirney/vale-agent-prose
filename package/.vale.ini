# Prose linting for the text an agent writes: markdown, the comments in a source file, and a
# commit message. This config picks the packages below so one defect yields one alert, which is
# what the switches in the [*] section are for.
#
# Std is Vale's own library. Google covers what Std does not, and is written for technical
# documentation. AiTells and Slop each catch the register an agent writes in, and AgentProse adds
# the forms both of them miss.
#
# The Readability package stays out. Its formulas pick the same documents as Flesch Reading Ease,
# which AgentProse has with a word-count gate. Its Polysyllables rule reports every long word, and
# its own comment says to switch it on only while you bring a score down.
#
# StylesPath and Vocab belong to the consumer, so this file sets neither.

MinAlertLevel = suggestion

# The slop package ships a second style for Simplified Technical English, which no section below
# names. It's a house style of its own: its contraction rule is an error on every contraction, and
# its dictionary rule restricts writing to an approved word list.
Packages = AiTells, Google, Harper, proselint, Std, write-good, \
           https://github.com/Syntaf/vale-llm-slop/releases/download/v0.1.0/vale-llm-slop.zip

[formats]
md = md
txt = md

# Vale reads a source file's comments as plain lines, so no sentence or paragraph rule applies.
# Mapping the extension to md parses each comment as markdown, and Vale still reads only the
# comments. This is the extension list of the source-file section below, minus Clojure and
# PowerShell. Vale reads those two by pattern rather than grammar, and mapping them fails the whole
# run with E100.
c = md
h = md
cc = md
cp = md
cpp = md
cxx = md
c++ = md
hpp = md
h++ = md
cs = md
csx = md
css = md
ex = md
exs = md
go = md
gemspec = md
hs = md
java = md
bsh = md
js = md
jsx = md
jl = md
kt = md
kts = md
less = md
lua = md
pl = md
pm = md
pod = md
php = md
proto = md
py = md
py3 = md
pyw = md
cpy = md
rpy = md
qml = md
r = md
rb = md
rs = md
sass = md
sbt = md
scala = md
scss = md
swift = md
ts = md
tsx = md

# Vale accumulates an individual rule setting across every section whose glob matches the file, so a
# rule switched off here is off everywhere. BasedOnStyles is the exception: the most specific section
# replaces it rather than adding to it, which is why each section below still names its own styles.
[*]

# One rule per defect. The second and third wording of one alert buys nothing on a line you were
# going to fix anyway.
#
# Std is Vale's own library and covers the defect. Google repeats it for documentation, and AiTells
# names the fix. AiTells wins where it has the rule, and Std wins over Google elsewhere. The Slop
# rules haven't been through this, so a defect Slop shares with AiTells reports twice.

# These rules all report the same span. `AiTells.Passive` survives, because `name who does the verb`
# is the only message among them that says what to do.
Std.Grammar.PassiveVoice = NO
Google.Passive = NO
write-good.Passive = NO

# AgentProse copies this rule with a wider pattern. Upstream's needs `and`, so a triad joined by
# `or` passes.
AiTells.AbstractTriad = NO

# AgentProse copies these rules with `\A` and `\z` for their anchors. Vale compiles every token in
# multiline mode, where upstream's `^` and `$` match at each line. A hard wrap puts a line break
# inside most sentences of a comment.
Std.Punctuation.OxfordComma = NO
Harper.DiscourseMarkers = NO
proselint.But = NO

# Std says the same thing in each of these pairs, and says it first.
Google.Acronyms = NO
Google.OxfordComma = NO
Google.Contractions = NO
Google.FirstPerson = NO
Google.We = NO
Google.Latin = NO
Google.GenderBias = NO

# `Std.Usage.GenderedTerms` has every term this rule has except `landlord` and `men and girls`.
proselint.GenderBias = NO

# Every plain word in this list is also in `proselint.Cliches`.
write-good.Cliches = NO

# `AiTells.Adverb` has `very`, the one word this rule flags.
proselint.Very = NO

# Its only fix is `excellent`, which `write-good.Weasel` then flags.
Harper.Excellent = NO

# E-Prime flags every use of `is`.
write-good.E-Prime = NO

# `Google.WordListCase` swaps a list of words for Google's preferred term. Its `above` entry matches the bare
# word, so it fires on `above ten` and on `Above all`, and the replacement it offers reads `the rules
# preceding`, which isn't English. Vale switches off a rule and not one entry of it, so this costs
# every other swap in the list.
Google.WordListCase = NO

# cspell does the spelling. It ships dictionaries per language and picks them by file type, where Vale has one
# list. What Vale catches and cspell doesn't is an identifier named in a comment, because cspell
# splits camelCase. Keeping that costs a vocabulary entry for every technical word in the prose.
Vale.Spelling = NO

# `Vale.Terms` demands the vocabulary's casing everywhere, so accepting an acronym costs a false
# positive on every lowercase use of the same letters. `HEAD`, `PUT` and `PATCH` each collide that way.
# The rule gives nothing back, because the vocabulary is an exception list.
Vale.Terms = NO

# Asks for an en dash in a numeric range, as in `40-55 ms`. Prose here stays ASCII, so the only fix
# this rule offers is one no file may take.
Harper.NumericRangeEnDash = NO

# Asks for the U+2026 ellipsis character in place of three periods, so it has the same unreachable
# fix. `Std.Punctuation` and Google both still flag an ellipsis itself, which a rewrite can answer.
proselint.Typography = NO

[*.md]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good

# `AgentProse.SourcePath` asks prose not to name a source file, because a rename breaks the
# reference. A markdown document names one on purpose, so the rule belongs to a source file's
# comments alone. This `NO` reaches only the extensions of the section it sits under, which is why
# it repeats below.
AgentProse.SourcePath = NO

# A commit message, which a hook passes as `vale --path=COMMIT_EDITMSG < "$1"`. The View reads
# past git's comment lines and the scissors diff, and types the body as markdown.
#
# Add the Commits package beside this one and its own section's View replaces this one, even
# from the consumer's own .vale.ini. Its View lints the trailers and the subject's type prefix.
[COMMIT_EDITMSG]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = CommitMessage
AgentProse.SourcePath = NO

# This is the extension list docs.vale.sh/formats/code documents, minus the bare filenames it also
# names (SConstruct, Gemfile, Rakefile, Brewfile), which need a section of their own. The list is
# compiled into Vale: an extension outside it reads as whole-file prose, and `[formats] mjs = js`
# doesn't add one, because a format association targets a markup format. With that mapping Vale
# reports nothing at all, and without it, the string literals as well as the comments. vue, mjs and
# cjs therefore need a View, the way shell does below.
#
# A View file takes no `[formats]` entry: with both, Vale reports nothing. Its View parses each
# comment as markdown instead.
[*.{c,h,cc,cp,cpp,cxx,c++,hpp,h++,cs,csx,clj,cljc,cljd,cljs,css,ex,exs,go,gemspec,hs,java,bsh,js,jsx,jl,kt,kts,less,lua,pl,pm,pod,php,proto,ps1,psd1,psm1,py,py3,pyw,cpy,rpy,qml,r,rb,rs,sass,sbt,scala,scss,swift,ts,tsx}]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good

# Vale's comment-syntax list covers js and jsx but stops short of the ES module extensions, so these
# reach their comments through a View of their own. See the section above for why no other route
# works.
[*.{mjs,cjs}]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = JavaScript

# Vale has no shell grammar, so these need the Shell view to reach their comments. Without it the
# whole file reads as prose and every string literal gets linted.
[*.{sh,bash,zsh}]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = Shell

# A command someone types and a git hook both have no extension, so nothing above matches them and
# Vale would read the whole file as prose. The assumption is that these directories hold shell,
# which is the common case and the only one a glob can express.
#
# One section each, because a brace group spanning path segments matches nothing. Under
# `[**/{bin,tools}/*]` no section applies and Vale reads the whole file as prose.
[**/bin/*]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = Shell

[**/githooks/*]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = Shell

[**/tools/*]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = Shell

# Comment syntax picks the View, never language family. Everything here comments with #, so the
# Shell view reaches it.
[*.{cfg,conf,example,fish,hcl,ini,nix,properties,tf,tfvars}]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = Shell

# YAML and TOML comment with # too, but Vale lints their comments itself as well, so the Shell
# view would report each alert twice. The View file says why it takes a grammar instead.
[*.{toml,yaml,yml}]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = DataComments

# Everything here comments with //. .query holds Overpass queries, whose comments carry the
# reasoning the query itself cannot, and .json5 differs from .json by having comments to reach.
[*.{gradle,json5,query,rules}]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
View = JavaScript

# Vale parses html itself, so a section is all it takes. Leave out adoc, rst and xml: each
# shells out to a binary a machine may lack (asciidoctor, docutils, an XSLT processor) and aborts
# the whole run rather than skipping the one file, taking every other file's alerts with it.
[*.html]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
AgentProse.SourcePath = NO

[*.txt]
BasedOnStyles = AgentProse, AiTells, Google, Harper, proselint, Slop, Std, Vale, write-good
AgentProse.SourcePath = NO

# An agent instruction file is one person addressing one agent, so it says `I` and `me` throughout.
# Std bans first person because product documentation has no single author, and that assumption
# doesn't hold here. Vale matches a section glob against the absolute path, so a bare filename
# matches nothing and needs the leading wildcard.
#
# Both spellings need a section even where one is a symlink to the other. Vale matches the path it
# receives and never resolves it, so a lint of the symlink reports under the symlink's own name.
[**/.claude/*.md]
Std.Usage.FirstPersonSingular = NO

[**/AGENTS.md]
Std.Usage.FirstPersonSingular = NO

[**/CLAUDE.md]
Std.Usage.FirstPersonSingular = NO
