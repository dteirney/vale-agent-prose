# The Commits package's View, with what isn't prose left out. In the subject that's the type
# prefix, the ticket key and the prefixes git's fixup options write. Below it, that's the trailers.
# A Vale configuration can't drop either from that View, because IgnoredScopes skips no View scope
# and TokenIgnores skips nothing in an untyped one.
#
# Any paragraph that opens with a `Token: value` line reads as trailers and isn't linted. A body
# paragraph that opens with `Note: the cache` is one.
engine: textfsm
template: |
  Value Subject (.+)
  Value Gap (.*)
  Value List Body (.*)
  Value List Trailer (.+)

  Start
    ^#\s*-+\s*>8\s*-+\s*$$ -> End
    ^# -> Next
    ^\s*$$ -> Next
    ^(?:(?:fixup|squash|amend)! )*(?:[a-z]+(?:\([^)]+\))?!?: )?(?:\[[A-Za-z][A-Za-z0-9]*-[0-9]+\] )?${Subject} -> Gap

  Gap
    ^#\s*-+\s*>8\s*-+\s*$$ -> End
    ^# -> Next
    ^${Gap} -> Continue
    ^\s*$$ -> Para
    ^(?=(?:(?i:breaking[ -]change)|[\w-]+)(?:: | #))${Trailer} -> Trailers
    ^${Body} -> Body

  Body
    ^#\s*-+\s*>8\s*-+\s*$$ -> End
    ^# -> Next
    ^(?=\s*$$)${Body} -> Para
    ^${Body}

  Para
    ^#\s*-+\s*>8\s*-+\s*$$ -> End
    ^# -> Next
    ^(?=\s*$$)${Body} -> Para
    ^(?=(?:(?i:breaking[ -]change)|[\w-]+)(?:: | #))${Trailer} -> Trailers
    ^${Body} -> Body

  Trailers
    ^#\s*-+\s*>8\s*-+\s*$$ -> End
    ^# -> Next
    ^\s*$$ -> Para
    ^${Trailer}
scopes:
  # An untyped scope has no code spans and no sentences, so a name in backticks gets linted and a
  # sentence-scoped rule never runs.
  - name: subject
    expr: Subject
    type: md
  - name: body
    expr: Body
    type: md
