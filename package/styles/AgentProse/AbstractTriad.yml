# AiTells.AbstractTriad with `or` accepted alongside `and`. Upstream's third pattern requires
# `and`, so a triad joined by `or` passes. The configuration switches the upstream rule off.
#
# Derived from vale-ai-tells, Copyright (c) 2026 Krishna Sunkam, MIT. See LICENSE.
extends: existence
message: "Abstract-noun triad '%s': name one concrete thing instead of three abstractions."
level: suggestion
ignorecase: true
raw:
  - '\b(?:[a-z-]+(?:ity|ness|tion|sion|ance|ence|ism|ship|ility)|trust|rigor|clarity|calm|craft|care|focus|discipline|taste|speed|scale|intent|judgment|courage|candor|warmth|depth|proof)'
  - ',\s+(?:[a-z-]+(?:ity|ness|tion|sion|ance|ence|ism|ship|ility)|trust|rigor|clarity|calm|craft|care|focus|discipline|taste|speed|scale|intent|judgment|courage|candor|warmth|depth|proof)'
  - ',?\s+(?:and|or)\s+(?:[a-z-]+(?:ity|ness|tion|sion|ance|ence|ism|ship|ility)|trust|rigor|clarity|calm|craft|care|focus|discipline|taste|speed|scale|intent|judgment|courage|candor|warmth|depth|proof)\b'
