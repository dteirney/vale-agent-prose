# The gates exist because a reading-ease score over a handful of sentences says nothing. Without
# them this rule grades a commit message and offers a fix nobody can make. Flesch divides by the
# sentence count, so one 100-word sentence clears the word gate and still means nothing.
extends: metric
message: "Flesch reading ease is %s, under 70."
link: https://en.wikipedia.org/wiki/Flesch%E2%80%93Kincaid_readability_tests

formula: |
  206.835 - (1.015 * (words / sentences)) - (84.6 * (syllables / words))

condition: "< 70 && words >= 100 && sentences >= 5"
