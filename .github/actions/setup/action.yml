name: Set up the gate's tools
description: Install every tool tools/check needs, at the versions mise.toml pins.

# Both workflows use this, which is what keeps a release from building against
# a different Vale than the gate ran.
runs:
  using: composite
  steps:
    - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
      with:
        version: 2026.10.4
