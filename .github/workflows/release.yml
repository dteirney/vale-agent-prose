name: release

on:
  push:
    branches: [main]

# Every write goes through the App's token. Events from the workflow's own
# token start no workflow, and the release PR needs its checks to run.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}

      - if: ${{ steps.release.outputs.release_created }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: ${{ steps.release.outputs.release_created }}
        uses: ./.github/actions/setup
      - if: ${{ steps.release.outputs.release_created }}
        run: tools/check

      # release-please writes the version into both manifests. This proves the
      # extra-files paths still reach them, because a manifest behind the tag
      # ships a plugin that a consumer never updates past.
      - name: Check the release against the manifests
        if: ${{ steps.release.outputs.release_created }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          found="$(jq -r '.. | objects | .version // empty' \
            .claude-plugin/plugin.json .claude-plugin/marketplace.json |
            sort -u)"
          if [[ "${found}" != "${VERSION}" ]]; then
            echo "the release says ${VERSION}, the manifests say: ${found}"
            exit 1
          fi

      - if: ${{ steps.release.outputs.release_created }}
        uses: ./.github/actions/build-package

      - name: Upload the package
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: gh release upload "${TAG}" AgentProse.zip
